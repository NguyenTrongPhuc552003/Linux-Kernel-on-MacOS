# ELMOS - Embedded Linux SDK (C++23)
# Taskfile for building the elmos CLI
# https://taskfile.dev

version: '3'

vars:
  BUILD_DIR: build
  BINARY: "{{.BUILD_DIR}}/bin/elmos"
  PREFIX: /usr/local
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  CMAKE_PRESET: default
  SRC_DIRS: src include
  SRC_EXTENSIONS: "cpp,hpp,h,cc,cxx"

tasks:
  # ============================================================================
  # Default & Core Build
  # ============================================================================

  default:
    desc: Build the elmos binary
    cmds:
      - task: build

  configure:
    desc: Configure CMake build (runs vcpkg install)
    cmds:
      - cmake --preset {{.CMAKE_PRESET}}
    status:
      - test -f {{.BUILD_DIR}}/CMakeCache.txt

  build:
    desc: Build the elmos binary
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --parallel
    sources:
      - "src/**/*.cpp"
      - "src/**/*.hpp"
      - "include/**/*.hpp"
      - "CMakeLists.txt"
      - "src/**/CMakeLists.txt"
    generates:
      - "{{.BINARY}}"

  clean:
    desc: Clean all build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}

  rebuild:
    desc: Full clean rebuild from scratch
    cmds:
      - task: clean
      - task: build

  # ============================================================================
  # Development Workflow (dev:*)
  # ============================================================================

  dev:check:
    desc: Pre-commit quality gate (format check + build + test)
    cmds:
      - task: fmt:check
      - task: build
      - task: test
    silent: false

  dev:setup:
    desc: Full developer environment bootstrap
    cmds:
      - task: dev:deps
      - task: clean
      - task: configure
      - task: build
      - task: test
      - echo "✓ Dev environment ready — binary at {{.BINARY}}"

  dev:deps:
    desc: Verify and report required development dependencies
    cmds:
      - |
        ok=1
        for cmd in cmake make git python3; do
          if command -v "$cmd" >/dev/null 2>&1; then
            printf "  ✓ %-16s %s\n" "$cmd" "$(command -v "$cmd")"
          else
            printf "  ✗ %-16s MISSING\n" "$cmd"
            ok=0
          fi
        done
        if command -v clang-format >/dev/null 2>&1; then
          printf "  ✓ %-16s %s\n" "clang-format" "$(clang-format --version | head -1)"
        else
          printf "  ⚠ %-16s optional (install for fmt commands)\n" "clang-format"
        fi
        [ "$ok" -eq 1 ] || { echo "Error: missing required dependencies"; exit 1; }

  dev:watch:
    desc: Rebuild on source changes (requires fswatch or entr)
    cmds:
      - |
        if command -v fswatch >/dev/null 2>&1; then
          echo "Watching src/ and include/ for changes..."
          fswatch -o src/ include/ CMakeLists.txt | while read -r _; do
            echo "--- Rebuilding ---"
            cmake --build {{.BUILD_DIR}} --parallel 2>&1 || true
          done
        elif command -v entr >/dev/null 2>&1; then
          echo "Watching src/ and include/ for changes..."
          find src include -name '*.cpp' -o -name '*.hpp' | entr -c cmake --build {{.BUILD_DIR}} --parallel
        else
          echo "Error: install fswatch (brew install fswatch) or entr for file watching"
          exit 1
        fi

  # ============================================================================
  # Formatting & Linting (fmt:*)
  # ============================================================================

  fmt:
    desc: Format all C++ source files in-place
    preconditions:
      - sh: command -v clang-format
        msg: "clang-format not found — install via: brew install clang-format"
    cmds:
      - |
        find {{.SRC_DIRS}} -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
          -exec clang-format -i {} +
        echo "✓ Formatted all C++ sources"

  fmt:check:
    desc: Verify formatting without modifying files (CI-safe)
    preconditions:
      - sh: command -v clang-format
        msg: "clang-format not found — install via: brew install clang-format"
    cmds:
      - |
        bad=$(find {{.SRC_DIRS}} -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
          -exec clang-format --dry-run --Werror {} + 2>&1 || true)
        if [ -n "$bad" ]; then
          echo "✗ Formatting violations found:"
          echo "$bad"
          echo ""
          echo "Run 'task fmt' to auto-fix."
          exit 1
        fi
        echo "✓ All files correctly formatted"

  fmt:diff:
    desc: Show formatting diff without applying changes
    preconditions:
      - sh: command -v clang-format
        msg: "clang-format not found — install via: brew install clang-format"
    cmds:
      - |
        find {{.SRC_DIRS}} -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
          -exec clang-format --dry-run {} + 2>&1 | head -200

  # ============================================================================
  # Installation (install:*)
  # ============================================================================

  install:
    desc: Install to /usr/local/bin
    deps: [build]
    cmds:
      - cmake --install {{.BUILD_DIR}} --prefix {{.PREFIX}}

  uninstall:
    desc: Remove elmos from /usr/local/bin
    cmds:
      - rm -f {{.PREFIX}}/bin/elmos

  # ============================================================================
  # Testing (test:*)
  # ============================================================================

  test:
    desc: Run all tests
    deps: [build]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target test

  test:verbose:
    desc: Run tests with verbose output
    deps: [build]
    cmds:
      - cd {{.BUILD_DIR}} && ctest --output-on-failure --verbose

  # ============================================================================
  # ELMOS CLI Wrappers (elmos:*)
  # ============================================================================

  elmos:doctor:
    desc: Run elmos doctor
    deps: [build]
    cmds:
      - "{{.BINARY}} doctor"

  elmos:status:
    desc: Show workspace status
    deps: [build]
    cmds:
      - "{{.BINARY}} status"

  elmos:version:
    desc: Show version info
    deps: [build]
    cmds:
      - "{{.BINARY}} version"

  # ============================================================================
  # Release (release:*)
  # ============================================================================

  release:
    desc: Build Release configuration
    cmds:
      - cmake --preset release
      - cmake --build build-release --parallel

  # ============================================================================
  # Source Analysis (info:*)
  # ============================================================================

  info:loc:
    desc: Count lines of C++ source code
    cmds:
      - |
        echo "=== ELMOS Source Line Counts ==="
        for dir in src include tests; do
          if [ -d "$dir" ]; then
            count=$(find "$dir" -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
              -exec cat {} + 2>/dev/null | wc -l | tr -d ' ')
            printf "  %-12s %s lines\n" "$dir/" "$count"
          fi
        done
        total=$(find src include tests -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
          -exec cat {} + 2>/dev/null | wc -l | tr -d ' ')
        echo "  ──────────────────────"
        printf "  %-12s %s lines\n" "total" "$total"

  info:targets:
    desc: List all CMake build targets
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --target help 2>/dev/null || echo "(target listing not supported)"

  # ============================================================================
  # Documentation (docs:*)
  # ============================================================================
  docs:
    desc: Build the documentation site
    deps: [docs:install]
    cmds:
      - NO_MKDOCS_2_WARNING=1 python3 -m mkdocs build

  docs:install:
    desc: Install documentation dependencies if missing
    internal: true
    cmds:
      - python3 -m pip install --upgrade "mkdocs>=1.6,<2" "mkdocs-material>=9,<10" "mkdocstrings[python]" mkdocs_puml --break-system-packages
    status:
      # Only run if required packages are found and MkDocs major version is < 2
      - python3 -c "import mkdocs, material, mkdocstrings, mkdocs_puml; import sys; sys.exit(0 if int(mkdocs.__version__.split('.', 1)[0]) < 2 else 1)" 2>/dev/null

  docs:clean:
    desc: Remove generated documentation build files
    cmds:
      - rm -rf build/site/

  docs:serve:
    desc: Serve the documentation site locally
    deps: [docs]
    cmds:
      - NO_MKDOCS_2_WARNING=1 python3 -m mkdocs serve
